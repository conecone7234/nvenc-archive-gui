name: CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Run tests
        run: |
          python -m pytest -q

  build-windows-exe:
    name: Build Windows exe
    runs-on: windows-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Build with PyInstaller
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name NvencArchiveGui --paths src src\ffmpeg_nvenc_gui\app.py

      - name: Create artifact folder
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifact | Out-Null
          Copy-Item dist\NvencArchiveGui.exe artifact\NvencArchiveGui.exe
          @"
          NvencArchiveGui.exe

          Put this exe in your work folder.
          If .\ffmpeg\ffmpeg.exe does not exist, the app can download FFmpeg on first run.

          Folder example:
          .\NvencArchiveGui.exe
          .\ffmpeg\ffmpeg.exe
          .\OBSData\
          .\SourceData\
          .\SourceData(MP4)\
          .\SourceData(4K)\
          .\tmp\
          "@ | Set-Content artifact\README_Run.txt -Encoding UTF8

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: NvencArchiveGui-windows-${{ github.sha }}
          path: artifact
          if-no-files-found: error
