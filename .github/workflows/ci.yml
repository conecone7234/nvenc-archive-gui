name: CI

on:
  push:
    branches:
      - main
      - preview
      - develop
  pull_request:
    branches:
      - main
      - preview
      - develop
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Run tests
        run: |
          python -m pytest -q

  build-windows-exe:
    name: Build Windows exe
    runs-on: windows-latest
    needs: test
    if: github.event_name == 'push' && contains(fromJSON('["main","preview","develop"]'), github.ref_name)

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Build with PyInstaller
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name NvencArchiveGui --paths src src\ffmpeg_nvenc_gui\app.py

      - name: Create artifact folder
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifact | Out-Null
          Copy-Item dist\NvencArchiveGui.exe artifact\NvencArchiveGui.exe
          @"
          NvencArchiveGui.exe

          Put this exe in your work folder.
          If .\ffmpeg\ffmpeg.exe or .\ffmpeg\ffprobe.exe does not exist, the app can download FFmpeg on first run.

          Default profile example:
          .\NvencArchiveGui.exe
          .\ffmpeg\ffmpeg.exe
          .\ffmpeg\ffprobe.exe
          .\Incoming\
          .\Encoded\
          .\SourceArchive\
          .\tmp\
          "@ | Set-Content artifact\README_Run.txt -Encoding UTF8

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: NvencArchiveGui-windows-${{ github.ref_name }}-${{ github.sha }}
          path: artifact
          if-no-files-found: error

  release:
    name: Create GitHub Release
    runs-on: windows-latest
    needs: build-windows-exe
    if: github.event_name == 'push' && contains(fromJSON('["main","preview","develop"]'), github.ref_name)
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: NvencArchiveGui-windows-${{ github.ref_name }}-${{ github.sha }}
          path: artifact

      - name: Prepare release metadata
        id: meta
        shell: pwsh
        run: |
          $version = python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])"
          $branch = "${{ github.ref_name }}"
          $run = "${{ github.run_number }}.${{ github.run_attempt }}"

          switch ($branch) {
            "main" {
              $tag = "v$version"
              $channel = "stable"
              $title = "NvencArchiveGui $tag"
              $prerelease = "false"
              $latest = "true"
            }
            "preview" {
              $tag = "v$version-preview.$run"
              $channel = "preview"
              $title = "NvencArchiveGui $tag Preview"
              $prerelease = "true"
              $latest = "false"
            }
            "develop" {
              $tag = "v$version-nightly.$run"
              $channel = "nightly"
              $title = "NvencArchiveGui $tag Nightly"
              $prerelease = "true"
              $latest = "false"
            }
            default {
              throw "Unsupported release branch: $branch"
            }
          }

          "tag=$tag" >> $env:GITHUB_OUTPUT
          "channel=$channel" >> $env:GITHUB_OUTPUT
          "title=$title" >> $env:GITHUB_OUTPUT
          "prerelease=$prerelease" >> $env:GITHUB_OUTPUT
          "latest=$latest" >> $env:GITHUB_OUTPUT

          @"
          Channel: $channel
          Branch: $branch
          Commit: ${{ github.sha }}

          This release was generated automatically from the $branch branch.
          The ZIP contains NvencArchiveGui.exe and a short run README.
          "@ | Set-Content release-notes.md -Encoding UTF8

      - name: Package release asset
        shell: pwsh
        run: |
          $tag = "${{ steps.meta.outputs.tag }}"
          Compress-Archive -Path artifact\* -DestinationPath "NvencArchiveGui-windows-$tag.zip" -Force

      - name: Create release
        shell: pwsh
        run: |
          $tag = "${{ steps.meta.outputs.tag }}"
          $title = "${{ steps.meta.outputs.title }}"

          if (gh release view $tag --json tagName 2>$null) {
            Write-Error "Release tag '$tag' already exists. Bump project.version in pyproject.toml before releasing this branch again."
            exit 1
          }

          $ghArgs = @(
            "release", "create", $tag,
            "artifact\NvencArchiveGui.exe",
            "NvencArchiveGui-windows-$tag.zip",
            "--target", "${{ github.sha }}",
            "--title", $title,
            "--notes-file", "release-notes.md"
          )

          if ("${{ steps.meta.outputs.prerelease }}" -eq "true") {
            $ghArgs += "--prerelease"
          }

          if ("${{ steps.meta.outputs.latest }}" -eq "true") {
            $ghArgs += "--latest"
          }

          gh @ghArgs
