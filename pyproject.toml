[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nvenc-archive-gui"
version = "0.2.0"
description = "Windows GUI encoder for FFmpeg NVENC archive jobs"
requires-python = ">=3.10"
dependencies = [
    "psutil>=5.9.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pyinstaller>=6.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
